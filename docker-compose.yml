services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rag_chatbot
      MYSQL_USER: rag_user
      MYSQL_PASSWORD: rag_password
      MYSQL_ROOT_PASSWORD: change_this_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pchange_this_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file:
      - .env
    environment:
      MYSQL_URL: mysql+pymysql://rag_user:rag_password@mysql:3306/rag_chatbot
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  huggingface_cache:

